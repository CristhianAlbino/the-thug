name: Core game rules

on:
  pull_request:
    paths:
      - 'Tools/HunterCore/**'
      - 'Tools/CompanionCore/**'
      - 'Tools/SurvivalCore/**'
      - 'Tools/PerceptionCore/**'
      - 'Tools/IntegrationCore/**'
      - 'Tools/SaveCore/**'
      - 'Tools/MapCore/**'
      - 'Tools/ScenarioLab/**'
      - 'Tools/WorldCore/**'
      - 'Tools/CampaignCore/**'
      - 'Tools/DirectorCore/**'
      - 'Tools/NarrativeCore/**'
      - 'Tools/ProductionCore/**'
      - '02_GAME_DESIGN/Narrative/**'
      - '.github/workflows/core-rules.yml'
  push:
    branches: [main]
    paths:
      - 'Tools/HunterCore/**'
      - 'Tools/CompanionCore/**'
      - 'Tools/SurvivalCore/**'
      - 'Tools/PerceptionCore/**'
      - 'Tools/IntegrationCore/**'
      - 'Tools/SaveCore/**'
      - 'Tools/MapCore/**'
      - 'Tools/ScenarioLab/**'
      - 'Tools/WorldCore/**'
      - 'Tools/CampaignCore/**'
      - 'Tools/DirectorCore/**'
      - 'Tools/NarrativeCore/**'
      - 'Tools/ProductionCore/**'
      - '02_GAME_DESIGN/Narrative/**'
      - '.github/workflows/core-rules.yml'

permissions:
  contents: read

jobs:
  cpp17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile and test engine-independent rules
        run: |
          bash Tools/HunterCore/run-tests.sh
          bash Tools/CompanionCore/run-tests.sh
          bash Tools/SurvivalCore/run-tests.sh
          bash Tools/PerceptionCore/run-tests.sh
          bash Tools/IntegrationCore/run-tests.sh
          bash Tools/SaveCore/run-tests.sh
          bash Tools/WorldCore/run-tests.sh
          bash Tools/DirectorCore/run-tests.sh
          bash Tools/CampaignCore/run-tests.sh
      - name: Validate CMake project files
        run: |
          for module in HunterCore CompanionCore SurvivalCore PerceptionCore IntegrationCore SaveCore WorldCore DirectorCore CampaignCore; do
            cmake -S "Tools/$module" -B "Build/$module"
            cmake --build "Build/$module"
            ctest --test-dir "Build/$module" --output-on-failure
          done
      - name: Validate hospital graph and escape routes
        run: python3 Tools/MapCore/validate_map.py
      - name: Verify source-linked production index
        run: python3 Tools/ProductionCore/build_manifest.py --check
      - name: Replay map and C++ route scenarios
        run: bash Tools/ScenarioLab/run-tests.sh
  windows-campaign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile native campaign with MSVC
        run: |
          cmake -S Tools/CampaignCore -B Build/CampaignCore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build Build/CampaignCore --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir Build/CampaignCore -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
