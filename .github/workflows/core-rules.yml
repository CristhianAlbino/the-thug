name: Core game rules

on:
  pull_request:
    paths:
      - 'Tools/HunterCore/**'
      - 'Tools/CompanionCore/**'
      - 'Tools/SurvivalCore/**'
      - 'Tools/PerceptionCore/**'
      - 'Tools/IntegrationCore/**'
      - 'Tools/SaveCore/**'
      - '.github/workflows/core-rules.yml'
  push:
    branches: [main]
    paths:
      - 'Tools/HunterCore/**'
      - 'Tools/CompanionCore/**'
      - 'Tools/SurvivalCore/**'
      - 'Tools/PerceptionCore/**'
      - 'Tools/IntegrationCore/**'
      - 'Tools/SaveCore/**'
      - '.github/workflows/core-rules.yml'

permissions:
  contents: read

jobs:
  cpp17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile and test engine-independent rules
        run: |
          bash Tools/HunterCore/run-tests.sh
          bash Tools/CompanionCore/run-tests.sh
          bash Tools/SurvivalCore/run-tests.sh
          bash Tools/PerceptionCore/run-tests.sh
          bash Tools/IntegrationCore/run-tests.sh
          bash Tools/SaveCore/run-tests.sh
      - name: Validate CMake project files
        run: |
          for module in HunterCore CompanionCore SurvivalCore PerceptionCore IntegrationCore SaveCore; do
            cmake -S "Tools/$module" -B "Build/$module"
            cmake --build "Build/$module"
            ctest --test-dir "Build/$module" --output-on-failure
          done
